# 每本手册的简短摘要，供 intent 规则无法判断时交给大模型做路由。
# key 必须和“手册/<产品名>手册.txt”中的产品名一致。
VR头显: "VR头显/虚拟现实设备手册，包含耳机/耳塞、遮光罩清洁、游玩区域尺寸、VR设备安全预防、使用维护等内容。"
专业相机: "专业数码相机/单反相机手册，包含电池充电、镜头安装、CF卡、快门按钮、AF模式、对焦、曝光、白平衡、ISO、闪光、取景器、图像回放、删除照片、连接电视、相机安全维护等内容。"
人体工学椅: "人体工学椅手册，包含椅子部件、组装步骤、扶手和座椅调节、使用功能、松动维护等内容。"
健身单车: "健身单车手册，包含技术规格、启动前检查、控制台和显示功能、座椅/把手调节、预设运动程序、用户档案、目标心率、体能测试等内容。"
健身追踪器: "健身追踪器/运动手环手册，包含包装清单、充电、佩戴位置、表带安装拆卸、界面操作、手机通知、皮肤温度、运动分析、心率、支付、锁屏和故障排除等内容。"
儿童电动摩托车: "儿童电动摩托车手册，包含挡泥板、前轮等部件安装及儿童电动车装配使用相关内容。"
冰箱: "冰箱/冰柜手册，包含使用安全、电源连接、冷藏冷冻设备注意事项、维护等内容。"
功能键盘: "功能键盘/机械键盘手册，包含保修政策、设置键盘、拆卸和安装轴体、搭配CAM软件、硬件模式使用等内容。"
发电机: "发电机手册，包含燃油安全、发动机和消音器安全、触电防护、燃油开关、燃油和机油检查、发动机启动停机、交流/直流连接、火花塞、空气滤清器、排空燃油和故障排除等内容。"
可编程温控器: "可编程温控器/恒温器手册，包含设置日期时间、系统和风扇模式、程序日程、临时温度调整、警报界面、热泵接线、端子不匹配处理、更换电池、故障排除等内容。"
吹风机: "吹风机/吹叶机手册，包含防护装备、安全操作、化油器调节、冷机启动、热机启动、关闭设备等内容。"
摩托艇: "摩托艇/水上摩托/jetski/boat手册，包含识别信息、航行限制、操作要求、水上规则、座椅和引擎开关、油门/操纵杆、QSTS、燃油表、登艇、转弯、滑航、拖曳、碰撞防护、清洁和维护等内容。"
水泵: "水泵手册，包含发动机安全停机、核心部件、油箱滤网清洗、排放燃油、无法抽水的原因诊断和解决等内容。"
洗碗机: "洗碗机手册，包含部件、排水口连接、添加专用盐/洗涤剂/洗涤块/亮碟剂、餐具篮安装、高度调节、滤网和喷淋臂清洁、不适合清洗的物品等内容。"
烤箱: "烤箱手册，包含烤箱门拆装、顶部加热元件、后部灯更换、接油盘、烤架、烤盘、油脂过滤器、滑动搁架、催化侧面板和外部清洁等内容。"
电钻: "电钻手册，包含充电、DCB101指示灯、电池组安装拆卸、无键夹头、腰带挂钩、批头夹、附件和三年有限保修等内容。"
相机: "混合即时相机/instax拍立得相机手册，包含腕带/肩带、电池充电、开关机、初始设置、装入/取出instax SQUARE相纸盒、自动/手动打印模式、拍摄和回放、打印照片、滤镜、亮度、暗角、自拍、闪光灯、存储卡、重印、故障排除和相纸保养等内容。"
空气净化器: "空气净化器手册，包含滤网塑料包装拆除、脚轮安装、空气质量指示灯、运行模式、设备内外清洁、滤网清洁和更换、灰尘传感器清洁、长期存放等内容。"
空调: "空调手册，包含空调部件、遥控器按键、电池安装、遥控器支架、快速调温、自清洁、等离子净化、自动运行、自动转换、节能制冷、无遥控器操作、自动重启、滤网清洁等内容。"
蒸汽清洁机: "蒸汽清洁机手册，包含快速组装、产品功能、快速上手、清洁硬质地面等内容。"
蓝牙激光鼠标: "蓝牙激光鼠标手册，包含安装电池、安装/卸载WIDCOMM蓝牙驱动、Windows快速配对、通过WIDCOMM配对、查看电量、首次使用驱动程序、连接其他人机接口设备等内容。"
