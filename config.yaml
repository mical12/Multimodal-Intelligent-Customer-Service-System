common:
  api_key: "sk-41544a86434d48aaab369a06d245903f"
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  model: "qwen3.7-plus"
  prompt_template: "你是一个专业、耐心的智能客服助手。回答要简洁、礼貌，并尽量给出下一步处理建议。"

agents:
  intent:
    model: "qwen3.7-plus"
    prompt_template: "你是意图识别助手，负责判断用户问题应该交给通用客服还是产品专家。"
    routing_mode: "global_rag"  # summary 或 global_rag

    global_rag_assist:
      enabled: true
      manual_count: 10
      snippets_per_manual: 2
      global_top_k: 10
      snippet_max_chars: 420
      max_images: 20

  expert:
    model: "qwen3.7-plus"
    prompt_template: "你是产品专家助手，负责结合产品手册回答安装、使用、故障排查等问题。"
    enable_thinking: true
    retrieval:
      top_k: 4
      neighbor_count: 1
      candidate_top_k: 10
      bm25_top_k: 10
      rerank:
        enabled: true
        model_dir: "Qwen3-Reranker-0.6B/models/Qwen3-Reranker-0.6B"
        max_length: 1024
        batch_size: 2
    agentic_rag:
      enabled: false
      max_steps: 6
      concurrency: 4
      max_images: 12
      search_tool: "bm25"  # bm25 或 keyword
      expand_neighbors:
        default_before_count: 2
        default_after_count: 2
        max_before_count: 4
        max_after_count: 4

  customer:
    model: "qwen3.6-flash"
    prompt_template: "你是电商客服助手，负责回答售后、物流、发票、退换货、投诉等通用客服问题。"
