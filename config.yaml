common:
  api_key: "sk-a973048a66c7453c8887fb859b4ae2bd"
  base_url: "https://api.deepseek.com"
  model: "deepseek-v4-pro"
  prompt_template: "你是一个专业、耐心的智能客服助手。回答要简洁、礼貌，并尽量给出下一步处理建议。"

agents:
  intent:
    model: "deepseek-v4-pro"
    prompt_template: "你是意图识别助手，负责判断用户问题应该交给通用客服还是产品专家。"
    routing_mode: "global_rag"  # summary 或 global_rag

    global_rag_assist:
      enabled: true
      manual_count: 10
      snippets_per_manual: 2
      global_top_k: 80
      snippet_max_chars: 420
      max_images: 20

  expert:
    model: "deepseek-v4-pro"
    prompt_template: "你是产品专家助手，负责结合产品手册回答安装、使用、故障排查等问题。"
    retrieval:
      top_k: 4
      neighbor_count: 1
      candidate_top_k: 10
      bm25_top_k: 10
      rerank:
        enabled: true
        model_dir: "Qwen3-Reranker-0.6B/models/Qwen3-Reranker-0.6B"
        max_length: 1024
        batch_size: 2

  customer:
    model: "deepseek-v4-pro"
    prompt_template: "你是电商客服助手，负责回答售后、物流、发票、退换货、投诉等通用客服问题。"
